<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>E-posta Onayı · Bütçemiz</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eff7f6; color: #143b3b; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 480px; padding: 36px 28px; border-radius: 24px; background: white; text-align: center; }
    h1 { font-size: 26px; line-height: 1.3; }
    p { color: #536b6b; }
    .brand { color: #087f80; font-weight: 700; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="brand">Bütçemiz</div>
    <h1 id="title">E-posta onayı</h1>
    <p id="message">Hesabınızı onaylamak için e-postanıza gelen bağlantıyı kullanın. Daha önce onayladıysanız Bütçemiz uygulamasından giriş yapabilirsiniz.</p>
  </main>
  <script>
    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    const error = hash.get('error') || query.get('error') || hash.get('error_code') || query.get('error_code');
    const confirmed = !error && hash.get('access_token') && hash.get('type') === 'signup';
    // Remove credentials immediately. This page never stores or transmits them.
    history.replaceState(null, '', location.pathname);
    if (error) {
      document.getElementById('title').textContent = 'Onay bağlantısı kullanılamıyor';
      document.getElementById('message').textContent = 'Bağlantının süresi dolmuş veya bağlantı daha önce kullanılmış olabilir. Hesabınızı onayladıysanız Bütçemiz uygulamasından giriş yapabilirsiniz.';
    } else if (confirmed) {
      document.getElementById('title').textContent = 'Hesabınız onaylandı';
      document.getElementById('message').textContent = 'E-posta adresiniz başarıyla doğrulandı. Bütçemiz uygulamasını açarak e-posta adresiniz ve şifrenizle giriş yapabilirsiniz. Bu sayfayı kapatabilirsiniz.';
    }
  </script>
</body>
</html>
